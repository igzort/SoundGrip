name: Build SoundGrip APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix Ubuntu APT Mirrors and Network Lag
        run: |
          # Принудительно включаем IPv4 для apt, настраиваем таймауты и 3 повторные попытки
          sudo sh -c 'echo "Acquire::ForceIPv4 \"true\";" > /etc/apt/apt.conf.d/99force-ipv4'
          sudo sh -c 'echo "Acquire::Retries \"3\";" >> /etc/apt/apt.conf.d/99force-ipv4'
          sudo sh -c 'echo "Acquire::http::Timeout \"30\";" >> /etc/apt/apt.conf.d/99force-ipv4'
          # Исправленный синтаксис sed: переключаем зеркала на стабильный главный репозиторий Ubuntu
          sudo sed -i 's|http://ubuntu.com|http://ubuntu.com|g' /etc/apt/sources.list
          sudo sed -i 's|http://ubuntu.com|http://ubuntu.com|g' /etc/apt/sources.list
          sudo apt-get update || true

      - name: Install System Dependencies
        run: |
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk python3-pip python3-dev autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libssl-dev libgdbm-dev libsqlite3-dev libffi-dev \
            libbz2-dev libreadline-dev build-essential ccache clang

      - name: Cache Buildozer Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Run Buildozer
        run: |
          python3 -m pip install --user --upgrade virtualenv
          python3 -m virtualenv venv
          source venv/bin/activate
          pip install --upgrade pip
          
          # Установка Buildozer из мастер-ветки и совместимого Cython
          pip install git+https://github.com
          pip install cython==0.29.33
          
          # Автоматическое принятие лицензий Android SDK перед сборкой
          yes | buildozer android clean
          yes | buildozer -v android debug
        env:
          CI: true

      - name: Find and Prepare APK Artifact
        id: locate_apk
        run: |
          # Динамический поиск: ищет созданный APK в любых папках
          APK_PATH=$(find . -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK file not found после сборки!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_ENV

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundGrip-debug-APK
          path: ${{ env.apk_path }}
          if-no-files-found: error
