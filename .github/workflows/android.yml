name: Build SoundGrip APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip python3-dev autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev libgdbm-dev libsqlite3-dev libffi-dev libbz2-dev libreadline-dev

      - name: Cache Buildozer Global Data
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-global-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-global-

      - name: Cache Buildozer Project Data
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: ${{ runner.os }}-buildozer-project-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-project-

      - name: Run Buildozer in Virtual Environment
        run: |
          # Устанавливаем virtualenv глобально
          python3 -m pip install --user virtualenv

          # Создаем изолированное окружение 'venv' в корне проекта
          python3 -m virtualenv venv

          # Активируем окружение и ставим чистый buildozer и cython
          source venv/bin/activate
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

          # Запускаем сборку с автоматическим принятием лицензий SDK
          buildozer android debug --accept-sdk-license

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundGrip-debug-APK
          path: bin/*.apk
