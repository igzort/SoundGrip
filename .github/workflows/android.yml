name: Build SoundGrip APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip python3-dev autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev libgdbm-dev libsqlite3-dev libffi-dev libbz2-dev libreadline-dev

      # Сбрасываем кэш на версию v3, чтобы полностью исключить влияние старых попыток скачать SDK 37
      - name: Cache Buildozer Global Data
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-global-v3-${{ hashFiles('buildozer.spec') }}

      - name: Run Buildozer in Virtual Environment
        run: |
          python3 -m pip install --user virtualenv
          python3 -m virtualenv venv
          source venv/bin/activate
          pip install --upgrade pip

          # Устанавливаем стабильный релиз Buildozer 1.5.0 вместо нестабильного master
          pip install buildozer==1.5.0
          pip install cython==0.29.33

          # Запуск сборки со стабильными инструментами
          buildozer android debug --accept-sdk-license

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundGrip-debug-APK
          path: bin/*.apk
