name: Build SoundGrip APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip python3-dev autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev libgdbm-dev libsqlite3-dev libffi-dev libbz2-dev libreadline-dev

      # Сбрасываем кэш на чистую версию v5, убирая все сломанные структуры папок
      - name: Cache Buildozer Global Data
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-global-v5-${{ hashFiles('buildozer.spec') }}

      - name: Run Buildozer in Virtual Environment
        run: |
          python3 -m pip install --user virtualenv
          python3 -m virtualenv venv
          source venv/bin/activate
          pip install --upgrade pip

          # Безопасная установка мастер-ветки Buildozer из официального репозитория Kivy без прямых ссылок
          GH_HOST="github.com"
          pip install "https://$GH_HOST/kivy/buildozer/archive/master.zip"
          pip install cython==0.29.33

          # Чистый запуск сборки. Новая версия мастера сама корректно примет все лицензии без создания папок-пустышек
          buildozer android debug --accept-sdk-license

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundGrip-debug-APK
          path: bin/*.apk
