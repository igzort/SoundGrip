name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Cache .buildozer
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('**/buildozer.spec') }}-${{ github.run_number }}

      - name: Cache Android SDK / NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer/android/platform
            ~/.android
          key: android-sdk-ndk-${{ runner.os }}-${{ hashFiles('**/buildozer.spec') }}

      - name: Install buildozer dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer

      - name: Build Android APK (debug)
        env:
          ANDROID_API: "33"
        uses: ArtemGovorov/buildozer-action@v1
        with:
          command: android debug deploy

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SoundGrip-APK
          path: bin/*.apk
