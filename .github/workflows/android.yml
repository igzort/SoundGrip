name: Build SoundGrip APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip python3-dev autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev libgdbm-dev libsqlite3-dev libffi-dev libbz2-dev libreadline-dev

      - name: Cache Buildozer Global Data
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-global-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-global-

      - name: Cache Buildozer Project Data
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: ${{ runner.os }}-buildozer-project-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-project-

      - name: Run Buildozer in Virtual Environment
        run: |
          python3 -m pip install --user virtualenv
          python3 -m virtualenv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

          # Предустановка лицензий Android SDK, чтобы предотвратить запросы (y/N)
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo -e "\n89354d86bcd4e447833d05aed4b874396b3a6c4c\nd56f5187479451eabf01fb74313026e2281c92d3\n24333f1a63b682509d3197ef7b4873cdef72dd35\n8aa526646944e9c84d22435afea470db0fa8668c" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "\n8491bb7475726d1f159c116284696f46e9431547" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license

          # Запуск сборки
          buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundGrip-debug-APK
          path: bin/*.apk
