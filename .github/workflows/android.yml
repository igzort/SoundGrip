name: Build SoundGrip APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip python3-dev autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev libgdbm-dev libsqlite3-dev libffi-dev libbz2-dev libreadline-dev

      - name: Fix Android SDK Paths for Buildozer
        run: |
          mkdir -p /usr/local/lib/android/sdk/tools/bin
          if [ -f "/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager" ]; then
            ln -sf /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager /usr/local/lib/android/sdk/tools/bin/sdkmanager
          fi
          yes | /usr/local/lib/android/sdk/tools/bin/sdkmanager --licenses --sdk_root=/usr/local/lib/android/sdk || true

      - name: Run Buildozer
        run: |
          python3 -m pip install --user virtualenv
          python3 -m virtualenv venv
          source venv/bin/activate
          pip install --upgrade pip
          
          DOM="github.com"
          REP="kivy/buildozer/archive/master.zip"
          pip install "https://$DOM/$REP"
          pip install cython==0.29.33
          
          buildozer android debug

      # ИСПРАВЛЕННЫЙ ШАГ: Ищем готовый APK-файл везде, где бы его ни сохранил Buildozer
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundGrip-debug-APK
          path: |
            bin/*.apk
            .buildozer/android/platform/build-*/**/*.apk
