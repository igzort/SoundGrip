name: Build SoundGrip APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java (Используем готовую встроенную Java)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run Buildozer directly using pre-installed GitHub SDK
        run: |
          pip3 install --user virtualenv
          python3 -m virtualenv venv
          source venv/bin/activate
          pip install --upgrade pip
          
          # Ставим Билдозер
          DOM="github.com"
          REP="kivy/buildozer/archive/master.zip"
          pip install "https://$DOM/$REP"
          pip install cython==0.29.33
          
          # КЛЮЧЕВОЙ ХАК: Заставляем Buildozer использовать встроенный в виртуалку GitHub стабильный Android SDK, 
          # где абсолютно все лицензии Google уже подписаны и приняты на уровне самого GitHub!
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          
          buildozer android debug
          
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundGrip-debug-APK
          path: bin/*.apk
